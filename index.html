<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b85c3c" />
  <title>QualityTime</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ ICONE DELLE SEZIONI (sprite) ============ -->
  <svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
    <symbol id="i-ricordi" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <circle cx="8.5" cy="10" r="1.6" />
      <path d="M21 16l-5-5-4 4-2-2-4 4" />
    </symbol>
    <symbol id="i-emozioni" viewBox="0 0 24 24">
      <path d="M12 20S3.5 14.5 3.5 8.8A4.3 4.3 0 0 1 12 6a4.3 4.3 0 0 1 8.5 2.8C20.5 14.5 12 20 12 20Z" />
    </symbol>
    <symbol id="i-sogni" viewBox="0 0 24 24">
      <path d="M12 3.5l2.5 5 5.5.8-4 3.9 1 5.5L12 16l-5 2.6 1-5.5-4-3.9 5.5-.8L12 3.5Z" />
      <path d="M19 3.5v2.6M17.7 4.8h2.6" />
    </symbol>
    <symbol id="i-gratitudine" viewBox="0 0 24 24">
      <rect x="3.5" y="9" width="17" height="11.5" rx="1.5" />
      <path d="M3.5 13h17M12 9v11.5" />
      <path d="M12 9S9.8 4.2 7.5 5.4C5.7 6.3 7 9 7 9h5Zm0 0s2.2-4.8 4.5-3.6C18.3 6.3 17 9 17 9h-5Z" />
    </symbol>
    <symbol id="i-relazioni" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3" />
      <path d="M3.6 20a5.4 5.4 0 0 1 10.8 0" />
      <path d="M16 5.5a3 3 0 0 1 0 6" />
      <path d="M17.4 14.2A5.4 5.4 0 0 1 20.4 19" />
    </symbol>
    <symbol id="i-quotidiano" viewBox="0 0 24 24">
      <path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z" />
      <path d="M17 10.5h2.2a2.3 2.3 0 0 1 0 4.6H17" />
      <path d="M8 3c-.5 1 .5 2 0 3M12 3c-.5 1 .5 2 0 3" />
    </symbol>
    <symbol id="i-famiglia" viewBox="0 0 24 24">
      <!-- fila dietro: 4 nonni -->
      <circle cx="4.3" cy="4.8" r="1.6" />
      <circle cx="9.4" cy="4.5" r="1.6" />
      <circle cx="14.6" cy="4.5" r="1.6" />
      <circle cx="19.7" cy="4.8" r="1.6" />
      <path d="M2.5 8.7q1.8-2.3 3.6 0M7.6 8.4q1.8-2.3 3.6 0M12.8 8.4q1.8-2.3 3.6 0M17.9 8.7q1.8-2.3 3.6 0" />
      <!-- centro: 2 genitori -->
      <circle cx="7.7" cy="10.9" r="2" />
      <circle cx="16.3" cy="10.9" r="2" />
      <path d="M4.4 15.6q3.3-3.8 6.6 0M12.4 15.6q3.3-3.8 6.6 0" />
      <!-- davanti: 1 bambino -->
      <circle cx="12" cy="15" r="1.45" />
      <path d="M9.8 19.3q2.2-2.7 4.4 0" />
    </symbol>
  </svg>

  <!-- ============ SCHERMATA INIZIALE ============ -->
  <section id="homeView" class="view">
    <div class="home-head">
      <img class="logo" src="icons/icon.svg" alt="" width="76" height="76" />
      <h1 class="brand">QualityTime</h1>
      <p class="tagline">Domande per rompere il ghiaccio e passare del tempo insieme</p>
    </div>

    <form id="addUserForm" class="add-user" autocomplete="off">
      <label for="newUserName" class="field-label">Chi gioca oggi?</label>
      <div class="add-row">
        <input id="newUserName" type="text" name="newUserName" placeholder="Nome della persona"
               maxlength="40" autocomplete="off" required />
        <button type="submit" class="primary">Inizia</button>
      </div>
    </form>

    <h2 class="list-title">Persone salvate</h2>
    <ul id="userList" class="user-list"></ul>
    <p id="usersEmpty" class="muted">Nessuna persona salvata. Scrivi un nome qui sopra per iniziare.</p>
  </section>

  <!-- ============ SCHERMATA GIOCO ============ -->
  <section id="gameView" class="view" hidden>
    <header class="topbar">
      <button id="backBtn" class="icon-btn" type="button" aria-label="Torna alla schermata iniziale">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span id="currentName" class="current-name"></span>
      <button id="historyBtn" class="icon-btn" type="button" aria-label="Mostra cronologia">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 0 8.94 10H19.9A7 7 0 1 1 13 5v4l5-5-5-5v4Z"/><path d="M12 8v5l4 2"/></svg>
      </button>
    </header>

    <main class="stage">
      <div id="category" class="category" hidden>
        <svg class="cat-icon" aria-hidden="true"><use id="catUse" href="#i-ricordi"/></svg>
        <span id="catName" class="cat-name"></span>
      </div>
      <p id="question" class="question">Premi il pulsante per iniziare.</p>
      <p id="counter" class="counter" aria-live="polite"></p>
    </main>

    <footer class="dock">
      <button id="drawBtn" class="primary big" type="button">Nuova domanda</button>

      <section id="filters" class="filters" aria-label="Sezioni delle domande">
        <div class="filters-head">
          <span class="filters-title">Sezioni</span>
          <button id="allSectionsBtn" class="text-btn" type="button">Tutte</button>
        </div>
        <div id="sectionChips" class="chips"></div>
        <p id="sectionsWarn" class="sections-warn" hidden>Seleziona almeno una sezione.</p>
      </section>
    </footer>
  </section>

  <!-- ============ PANNELLO CRONOLOGIA ============ -->
  <section id="historyPanel" class="panel" hidden aria-labelledby="historyTitle">
    <div class="panel-head">
      <h2 id="historyTitle">Cronologia</h2>
      <div class="panel-actions">
        <button id="clearHistoryBtn" class="text-btn" type="button">Svuota</button>
        <button id="closeHistoryBtn" class="icon-btn" type="button" aria-label="Chiudi cronologia">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <ol id="historyList" class="history-list"></ol>
    <p id="historyEmpty" class="history-empty">Nessuna domanda estratta finora.</p>
  </section>

  <div id="scrim" class="scrim" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
